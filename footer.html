
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">  

 </head>
 <style>
    .footer {
  background-color: grey;
  padding: 20px;
  color: #fff;
  padding: 40px 20px 20px;
  font-family: 'Poppins', sans-serif;
  margin-bottom:100px    ;
}

.footer-container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 30px;
  max-width: 1200px;
  margin: auto;
}

.footer h2, .footer h3 {
  color: #e50914;
}

.footer a {
  color: #ccc;
  text-decoration: none;
}

.footer a:hover {
  color: #fff;
  text-decoration: underline;
}

.footer-about p,
.footer-contact p {
  font-size: 14px;
  margin-top: 10px;
}

.footer-links ul {
  list-style: none;
  padding: 0;
}

.footer-links li {
  margin-bottom: 10px;
}

.social-icons a {
  margin-right: 10px;
  font-size: 18px;
  color: #ccc;
}

.social-icons a:hover {
  color: #e50914;
}

.footer-bottom {
  text-align: center;
  padding-top: 20px;
  border-top: 1px solid #333;
  font-size: 13px;
}
@media (max-width: 768px) {
  .footer-container {
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .footer-column {
    flex: 1 1 100%;
  }
} 
 </style>
 <body>
    <footer class="footer" >
  <div class="footer-container">
    <div class="footer-about">
      <h2>Ekta Sharma </h2>
      <p>Building amazing web experiences with passion and creativity.</p>
    </div>

    <div class="footer-links">
      <h3>Quick Links</h3>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </div>    

    <div class="footer-contact">
      <h3>Contact Us</h3>
      <p>Email: ektasharmag2g@email.com</p>
      <p>Phone: 91+ 8949 611 421</p>
    </div>

    <div class="footer-social">
      <h3>Follow Us</h3>
      <div class="social-icons">
        <a href="#"><i class="fab fa-github"></i></a>
        <a href="#"><i class="fab fa-linkedin"></i></a>
      
      </div>
    </div>
  </div>
  <div class="footer-bottom">
    <p>&copy; 2025 YourCompany. All rights reserved.</p>
  </div>
</footer>

    
 </body>
 </html>
